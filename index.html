let lang=(function(){try{const s=localStorage.getItem("lang");if(s==="es"||s==="en")return s;}catch(e){}return /^es/i.test(navigator.language||"")?"es":"en";})();
let state={q:"",set:"All",rar:"All",sort:"value"};
let lbList=[],lbI=0,listOpen=false;

function T(){return I18N[lang];}
function $(id){return document.getElementById(id);}
function byId(id){return PRODUCTS.find(p=>p.id===id);}
function photo(p){return "images/"+p.id+".jpg";}
function thumb(p){return "images/thumbs/"+p.id+".webp";}
function condOf(p){const c=p.cond||DEF_COND;return lang==="es"?(COND_ES[c]||c):c;}
function rarLabel(r){return lang==="es"?(RAR_ES[r]||r):r;}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}
function uniq(key){return [...new Set(PRODUCTS.map(p=>p[key]))];}
function tgLink(msg){return "https://t.me/"+CONTACT.telegram+"?text="+encodeURIComponent(msg);}
function singleMsg(p){return T().msg1.replace("{id}",p.id).replace("{name}",p.name).replace("{num}",p.num);}
function showToast(m){const el=$("toast");el.textContent=m;el.classList.add("on");clearTimeout(window._tt);window._tt=setTimeout(()=>el.classList.remove("on"),2200);}
function copyText(s){try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(s).catch(()=>{});}catch(e){}}

let bundle=(function(){try{const b=JSON.parse(localStorage.getItem("pkbundle")||"[]");return Array.isArray(b)?b:[];}catch(e){return [];}})();
bundle=bundle.filter(id=>{const p=byId(id);return p&&!p.sold;});
function saveBundle(){try{localStorage.setItem("pkbundle",JSON.stringify(bundle));}catch(e){}}

function buildChips(containerId,values,stateKey,labelFn){
  const c=$(containerId);
  [...c.querySelectorAll(".chip")].forEach(x=>x.remove());
  ["All",...values].forEach(v=>{
    const el=document.createElement("span");
    el.className="chip"+(state[stateKey]===v?" on":"");
    el.textContent=v==="All"?T().all:labelFn(v);
    el.onclick=()=>{state[stateKey]=v;[...c.querySelectorAll(".chip")].forEach(x=>x.classList.remove("on"));el.classList.add("on");render();};
    c.appendChild(el);
  });
}
function rebuildChips(){
  buildChips("sets",uniq("set").sort((a,b)=>(SETORDER[a]||9)-(SETORDER[b]||9)),"set",v=>v);
  buildChips("rars",uniq("rar").sort((a,b)=>(RARORDER[a]||9)-(RARORDER[b]||9)),"rar",rarLabel);
}

function priceText(p){
  if(p.price==null) return {big:T().makeoffer,obo:""};
  return {big:"$"+p.price,obo:T().obo};
}
function buyButtons(p){
  const t=T();
  if(p.sold) return `<span class="soldbtn">${t.sold}</span>`;
  const inB=bundle.includes(p.id);
  let b=`<button class="btn add${inB?" on":""}" data-id="${p.id}">${inB?t.added:t.add}</button>`;
  if(CONTACT.telegram) b+=`<a class="btn tg" href="${tgLink(singleMsg(p))}" target="_blank" rel="noopener">${t.tg}</a>`;
  return b;
}

function render(){
  const t=T();
  let list=PRODUCTS.filter(p=>{
    if(state.set!=="All"&&p.set!==state.set) return false;
    if(state.rar!=="All"&&p.rar!==state.rar) return false;
    if(state.q){
      const tx=(p.name+" "+p.num+" "+p.set+" "+p.rar+" "+rarLabel(p.rar)+" "+p.year+" #"+p.id).toLowerCase();
      if(!tx.includes(state.q.toLowerCase())) return false;
    }
    return true;
  });
  const s=state.sort;
  const pv=p=>p.price==null?Infinity:p.price;
  const pvHi=p=>p.price==null?-1:p.price;
  if(s==="price-asc") list.sort((a,b)=>pv(a)-pv(b)||a.id.localeCompare(b.id));
  else if(s==="price-desc"||s==="value") list.sort((a,b)=>pvHi(b)-pvHi(a)||a.id.localeCompare(b.id));
  else if(s==="name-asc") list.sort((a,b)=>a.name.localeCompare(b.name));
  else if(s==="name-desc") list.sort((a,b)=>b.name.localeCompare(a.name));
  else list.sort((a,b)=>a.id.localeCompare(b.id));
  // sold cards always sink to the bottom, keeping the sort order within each group
  list=[...list.filter(p=>!p.sold),...list.filter(p=>p.sold)];

  $("count").textContent=list.length+" "+(list.length!==1?t.cards:t.card);
  const g=$("grid");
  g.innerHTML="";
  lbList=list;
  if(!list.length){g.innerHTML='<div class="empty">'+t.none+'</div>';return;}
  list.forEach(p=>{
    const pt=priceText(p);
    const card=document.createElement("div");card.className="card"+(p.sold?" sold":"");card.id="item-"+p.id;
    card.innerHTML=`
      <div class="ph" data-id="${p.id}">
        <img src="${thumb(p)}" loading="lazy" decoding="async" alt="${esc(p.name+" "+p.num+" "+p.set)} Pokemon card" onerror="this.onerror=null;this.src='${photo(p)}'"/>
        <span class="badge">#${p.id} &middot; ${SETSHORT[p.set]}</span>
        ${p.sold?'<span class="soldstamp">'+t.soldstamp+'</span>':''}
      </div>
      <div class="body">
        <div class="nm">${esc(p.name)}</div>
        <div class="ln">${p.num} &middot; ${p.set} &middot; ${p.year} &middot; ${rarLabel(p.rar)}</div>
        <div class="cond">${esc(condOf(p))}</div>
        <div class="pr">${pt.big} ${pt.obo?`<span class="obo">${pt.obo}</span>`:""}</div>
        <div class="btns">${buyButtons(p)}</div>
        <div class="iid">${t.iid}${p.id} &middot; <span class="lnk" data-id="${p.id}">${t.link}</span></div>
      </div>`;
    g.appendChild(card);
  });
}

function renderStats(){
  const t=T();
  const live=PRODUCTS.filter(p=>!p.sold);
  const holos=live.filter(p=>p.rar==="Holo Rare");
  const minHolo=holos.reduce((m,p)=>p.price!=null&&p.price<m?p.price:m,Infinity);
  const sets=[...new Set(live.map(p=>SETSHORT[p.set]))];
  let s=live.length+" "+t.cards+" · "+sets.join(" · ");
  if(isFinite(minHolo)) s+=" · "+t.holosfrom+minHolo;
  s+=" · "+t.tagend;
  $("tagline").textContent=s;
}

/* ---------- bundle ---------- */
function bundleItems(){return bundle.map(byId).filter(Boolean);}
function bundleMsg(){
  const t=T(),items=bundleItems();
  const total=items.reduce((a,p)=>a+(p.price||0),0);
  let lines;
  if(items.length>40) lines=[items.map(p=>"#"+p.id).join(" ")];
  else lines=items.map(p=>"#"+p.id+" "+p.name+" "+p.num+" — "+(p.price==null?t.offer:"$"+p.price));
  let m=t.bmsg.replace("{n}",items.length)+"\n"+lines.join("\n")+"\n"+t.btotal.replace("{t}",total);
  if(items.length>=BUNDLE_MIN) m+="\n"+t.bdisc;
  return m;
}
function updateBar(){
  const t=T(),items=bundleItems(),n=items.length;
  document.body.classList.toggle("hasbar",n>0);
  if(!n){listOpen=false;$("blist").classList.remove("on");return;}
  const total=items.reduce((a,p)=>a+(p.price||0),0);
  $("bsum").innerHTML=t.bundle+": "+n+" "+(n!==1?t.cards:t.card)+" · <span>$"+total+"</span>";
  $("bview").textContent=listOpen?t.hide:t.view;
  $("bclear").textContent=t.clear;
  $("bsend").textContent=t.send;
  $("bsend").href=tgLink(bundleMsg());
  $("bhint").textContent=n>=BUNDLE_MIN?t.disc:t.more.replace("{n}",BUNDLE_MIN-n);
  $("blist").innerHTML=items.map(p=>`<div class="bi"><span class="bn">#${p.id} ${esc(p.name)} ${p.num}</span><span class="bp">${p.price==null?t.offer:"$"+p.price}</span><span class="rm" data-id="${p.id}" title="${t.clear}">&times;</span></div>`).join("");
  $("blist").classList.toggle("on",listOpen);
}
function syncAddButtons(){
  const t=T();
  document.querySelectorAll(".add").forEach(b=>{const on=bundle.includes(b.getAttribute("data-id"));b.classList.toggle("on",on);b.textContent=on?t.added:t.add;});
}
function toggleBundle(id){
  const p=byId(id);if(!p||p.sold)return;
  const i=bundle.indexOf(id);
  if(i>=0)bundle.splice(i,1);else bundle.push(id);
  saveBundle();syncAddButtons();updateBar();
}

/* ---------- lightbox + per-card links ---------- */
function lbShow(){
  const p=lbList[lbI],t=T(),pt=priceText(p);
  $("lbimg").src=photo(p);
  $("lbimg").alt=p.name+" "+p.num+" "+p.set;
  $("lbcap").textContent="#"+p.id+" · "+p.name+" · "+p.num+" · "+p.set+" · "+rarLabel(p.rar);
  $("lbpr").innerHTML="<b>"+pt.big+"</b> "+(pt.obo||"")+" · "+esc(condOf(p));
  $("lbbtns").innerHTML=buyButtons(p)+`<button class="btn add lnk2" data-link="${p.id}">${t.link}</button>`;
  try{history.replaceState(null,"","#"+p.id);}catch(e){}
}
function openLb(i){lbI=i;lbShow();$("lb").classList.add("on");}
function closeLb(){$("lb").classList.remove("on");try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}}
function lbStep(d){lbI=(lbI+d+lbList.length)%lbList.length;lbShow();}
function openById(id){
  let i=lbList.findIndex(p=>p.id===id);
  if(i<0){
    if(!byId(id))return;
    state.q="";state.set="All";state.rar="All";$("q").value="";
    rebuildChips();render();
    i=lbList.findIndex(p=>p.id===id);
    if(i<0)return;
  }
  openLb(i);
}
function handleHash(){
  const h=(location.hash||"").replace("#","").replace(/^item-/,"");
  if(/^\d{3}$/.test(h))openById(h);
}
function copyItemLink(id){copyText(SITE+"#"+id);showToast(T().linktoast);}

document.addEventListener("click",e=>{
  const el=e.target;
  const lk=el.closest("[data-link]");if(lk){copyItemLink(lk.getAttribute("data-link"));return;}
  const ln=el.closest(".lnk");if(ln){copyItemLink(ln.getAttribute("data-id"));return;}
  const ad=el.closest(".add");if(ad){toggleBundle(ad.getAttribute("data-id"));return;}
  const rm=el.closest(".rm");if(rm){toggleBundle(rm.getAttribute("data-id"));return;}
  const ph=el.closest(".ph");if(ph){openById(ph.getAttribute("data-id"));return;}
  const lc=el.closest(".lc");if(lc){setLang(lc.getAttribute("data-lang"));return;}
  if(el.id==="lb"||el.id==="lbx"){closeLb();return;}
  if(el.id==="lbprev"){lbStep(-1);return;}
  if(el.id==="lbnext"){lbStep(1);return;}
  if(el.id==="bview"){listOpen=!listOpen;updateBar();return;}
  if(el.id==="bclear"){bundle=[];saveBundle();syncAddButtons();updateBar();return;}
  if(el.id==="bsend"){copyText(bundleMsg());showToast(T().msgtoast);return;}
});
document.addEventListener("keydown",e=>{
  if(!$("lb").classList.contains("on"))return;
  if(e.key==="Escape")closeLb();
  if(e.key==="ArrowLeft")lbStep(-1);
  if(e.key==="ArrowRight")lbStep(1);
});
$("q").addEventListener("input",e=>{state.q=e.target.value;render();});
$("sort").addEventListener("change",e=>{state.sort=e.target.value;render();});
window.addEventListener("hashchange",handleHash);

function applyLang(){
  const t=T();
  document.documentElement.lang=lang;
  $("subt").textContent=t.sub;
  $("q").placeholder=t.search;
  $("l-sort").textContent=t.sort;
  $("l-set").textContent=t.set;
  $("l-rar").textContent=t.rar;
  const so=$("sort").options;
  so[0].textContent=t.value;so[1].textContent=t.binder;so[2].textContent=t.plh;so[3].textContent=t.phl;so[4].textContent=t.naz;so[5].textContent=t.nza;
  $("foot").textContent=t.footer;
  $("xlink").textContent=t.xlink;
  $("xlink2").textContent=t.xlink;
  $("lang-es").classList.toggle("on",lang==="es");
  $("lang-en").classList.toggle("on",lang==="en");
  rebuildChips();renderStats();render();updateBar();
  if($("lb").classList.contains("on"))lbShow();
}
function setLang(l){lang=l;try{localStorage.setItem("lang",l);}catch(e){}applyLang();}

/* product data for search engines, generated from PRODUCTS so it never goes stale */
(function(){
  const items=PRODUCTS.map((p,i)=>{
    const prod={"@type":"Product",name:p.name+" "+p.num+" - "+p.set+" ("+p.year+")",image:SITE+photo(p),url:SITE+"#"+p.id,category:"Trading Cards",brand:{"@type":"Brand",name:"Pokémon TCG"},description:p.rar+" · "+(p.cond||DEF_COND)};
    if(p.price!=null) prod.offers={"@type":"Offer",priceCurrency:"USD",price:p.price,itemCondition:"https://schema.org/UsedCondition",availability:p.sold?"https://schema.org/OutOfStock":"https://schema.org/InStock",url:SITE+"#"+p.id};
    return {"@type":"ListItem",position:i+1,item:prod};
  });
  const s=document.createElement("script");s.type="application/ld+json";
  s.textContent=JSON.stringify({"@context":"https://schema.org","@type":"ItemList",name:"Vintage Pokémon Cards for Sale · San Juan, PR",itemListElement:items});
  document.head.appendChild(s);
})();

applyLang();
handleHash();
</script>
